<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predicción Titanic - Minería de Datos</title>
    <!-- CDN oficial de Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl max-w-lg w-full border border-slate-100">
        <div class="text-center mb-6">
            <span class="text-4xl">🚢</span>
            <h2 class="text-2xl font-bold text-slate-800 mt-2">Supervivencia del Titanic</h2>
            <p class="text-slate-500 text-sm mt-1">Proyecto de Minería de Datos — Modelo Random Forest</p>
        </div>

        <form id="predictionForm" class="space-y-4">
            <!-- Pclass y Sex -->
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Clase del Pasajero</label>
                    <select id="Pclass" class="w-full p-2.5 border border-slate-200 rounded-xl bg-slate-50 text-slate-800 text-sm focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition">
                        <option value="1">1ra Clase (Alta)</option>
                        <option value="2">2da Clase (Media)</option>
                        <option value="3" selected>3ra Clase (Baja)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Género</label>
                    <select id="Sex" class="w-full p-2.5 border border-slate-200 rounded-xl bg-slate-50 text-slate-800 text-sm focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition">
                        <!-- CORRECCIÓN SEGÚN TU MODELO: female es 1 y male es 0 -->
                        <option value="1" selected>Femenino</option>
                        <option value="0">Masculino</option>
                    </select>
                </div>
            </div>

            <!-- Age y Fare -->
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Edad (Age)</label>
                    <input type="number" id="Age" value="30" step="0.5" class="w-full p-2.5 border border-slate-200 rounded-xl bg-slate-50 text-slate-800 text-sm focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Tarifa Pagada (Fare)</label>
                    <input type="number" id="Fare" value="15.5" step="0.01" class="w-full p-2.5 border border-slate-200 rounded-xl bg-slate-50 text-slate-800 text-sm focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition" required>
                </div>
            </div>

            <!-- SibSp y Parch -->
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Hermanos/Esposos (SibSp)</label>
                    <input type="number" id="SibSp" value="0" min="0" class="w-full p-2.5 border border-slate-200 rounded-xl bg-slate-50 text-slate-800 text-sm focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Padres/Hijos (Parch)</label>
                    <input type="number" id="Parch" value="0" min="0" class="w-full p-2.5 border border-slate-200 rounded-xl bg-slate-50 text-slate-800 text-sm focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition" required>
                </div>
            </div>

            <!-- Family_Size y Fare_Per_Person -->
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Tamaño Familia (Auto)</label>
                    <input type="number" id="Family_Size" value="1" class="w-full p-2.5 border border-slate-200 rounded-xl bg-slate-100 text-slate-400 text-sm outline-none cursor-not-allowed" readonly>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Tarifa por Persona (Auto)</label>
                    <input type="number" id="Fare_Per_Person" value="15.5" step="0.01" class="w-full p-2.5 border border-slate-200 rounded-xl bg-slate-100 text-slate-400 text-sm outline-none cursor-not-allowed" readonly>
                </div>
            </div>

            <!-- Botón Enviar -->
            <button type="submit" class="w-full mt-2 bg-blue-600 text-white p-3 rounded-xl font-semibold shadow-md shadow-blue-200 hover:bg-blue-700 hover:shadow-none active:scale-[0.99] transition duration-150 cursor-pointer">
                Calcular Predicción
            </button>
        </form>

        <!-- Cuadro de resultados dinámicos -->
        <div id="resultBox" class="mt-6 p-4 rounded-xl hidden text-center font-medium border transition-all duration-300">
            <h3 id="resultMessage" class="text-xl font-bold mb-1"></h3>
            <p id="resultProbability" class="text-sm opacity-90"></p>
        </div>
    </div>

    <script>
        const sibSpInput = document.getElementById('SibSp');
        const parchInput = document.getElementById('Parch');
        const fareInput = document.getElementById('Fare');
        const familySizeInput = document.getElementById('Family_Size');
        const farePerPersonInput = document.getElementById('Fare_Per_Person');

        function actualizarCamposCalculados() {
            const sibSp = parseInt(sibSpInput.value) || 0;
            const parch = parseInt(parchInput.value) || 0;
            const fare = parseFloat(fareInput.value) || 0;

            const familySize = sibSp + parch + 1;
            familySizeInput.value = familySize;

            const farePerPerson = fare / familySize;
            farePerPersonInput.value = farePerPerson.toFixed(4);
        }

        sibSpInput.addEventListener('input', actualizarCamposCalculados);
        parchInput.addEventListener('input', actualizarCamposCalculados);
        fareInput.addEventListener('input', actualizarCamposCalculados);

        document.getElementById('predictionForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const payload = {
                Pclass: parseInt(document.getElementById('Pclass').value),
                Sex: parseInt(document.getElementById('Sex').value),
                Age: parseFloat(document.getElementById('Age').value),
                SibSp: parseInt(document.getElementById('SibSp').value),
                Parch: parseInt(document.getElementById('Parch').value),
                Fare: parseFloat(document.getElementById('Fare').value),
                Family_Size: parseInt(document.getElementById('Family_Size').value),
                Fare_Per_Person: parseFloat(document.getElementById('Fare_Per_Person').value)
            };

            const resultBox = document.getElementById('resultBox');
            const resultMessage = document.getElementById('resultMessage');
            const resultProbability = document.getElementById('resultProbability');

            try {
                const response = await fetch('http://127.0.0.1:8000/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error('Error al conectar con la API');

                const data = await response.json();

                resultBox.classList.remove('hidden');

                if (data.prediction === 1) {
                    resultBox.className = "mt-6 p-4 rounded-xl text-center bg-emerald-50 text-emerald-800 border-emerald-200 shadow-sm shadow-emerald-50";
                    resultMessage.innerText = "🟢 ¡Sobrevivió!";
                } else {
                    resultBox.className = "mt-6 p-4 rounded-xl text-center bg-rose-50 text-rose-800 border-rose-200 shadow-sm shadow-rose-50";
                    resultMessage.innerText = "🔴 No Sobrevivió";
                }

                const porcentaje = (data.probability * 100).toFixed(2);
                resultProbability.innerText = `Probabilidad calculada por Random Forest: ${porcentaje}%`;

            } catch (error) {
                resultBox.classList.remove('hidden');
                resultBox.className = "mt-6 p-4 rounded-xl text-center bg-amber-50 text-amber-800 border-amber-200";
                resultMessage.innerText = "⚠️ Error de Conexión";
                resultProbability.innerText = "Asegúrate de que la API de FastAPI esté encendida en tu terminal.";
                console.error(error);
            }
        });
    </script>
</body>
</html>
